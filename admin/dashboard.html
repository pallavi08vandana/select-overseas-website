<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#06285f"
    >

    <title>
        Management Dashboard | Select Overseas
    </title>

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

</head>


<body class="admin-page">


    <!-- =====================================================
         MANAGEMENT HEADER
    ====================================================== -->

    <header class="admin-header">


        <!-- LOGO -->

        <div class="admin-brand">

            <a
                href="../index.html"
                class="admin-logo-link"
            >

                <img
                    src="../assets/select-overseas-logo.png"
                    alt="Select Overseas"
                    class="admin-logo"
                >

            </a>


            <span class="admin-brand-text">
                Management Portal
            </span>

        </div>


        <!-- ADMIN INFORMATION -->

        <div class="admin-header-right">

            <span
                id="adminEmail"
                class="admin-email"
            ></span>


            <button
                id="logoutBtn"
                class="logout"
                type="button"
            >
                Logout
            </button>

        </div>


    </header>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-main">


        <!-- =================================================
             STATISTICS
        ================================================== -->

        <section
            class="stats"
            id="stats"
        ></section>



        <!-- =================================================
             SEARCH & FILTER
        ================================================== -->

        <section class="toolbar">


            <input
                type="text"
                id="searchInput"
                placeholder="Search name, phone, email or product"
                autocomplete="off"
            >


            <select id="productFilter">

                <option value="">
                    All Products
                </option>

                <option>
                    Germany Opportunity Card
                </option>

                <option>
                    Germany EU Blue Card
                </option>

                <option>
                    Ireland Critical Skills Employment Permit
                </option>

                <option>
                    Netherlands Highly Skilled Migrant
                </option>

                <option>
                    New Zealand Employment Pathway
                </option>

                <option>
                    European Employment Pathway
                </option>

            </select>


            <select id="statusFilter">

                <option value="">
                    All Statuses
                </option>

                <option>
                    New
                </option>

                <option>
                    Contacted
                </option>

                <option>
                    Follow-up
                </option>

                <option>
                    Qualified
                </option>

                <option>
                    Documents Pending
                </option>

                <option>
                    Documents Received
                </option>

                <option>
                    Processing
                </option>

                <option>
                    Converted
                </option>

                <option>
                    Closed
                </option>

                <option>
                    Not Interested
                </option>

            </select>


        </section>



        <!-- =================================================
             LEADS
        ================================================== -->

        <section class="lead-section">


            <div class="section-title">

                <div>

                    <h2>
                        Client Leads
                    </h2>

                    <p>
                        Review and manage enquiries submitted through the website.
                    </p>

                </div>


                <button
                    id="refreshBtn"
                    type="button"
                >
                    Refresh
                </button>

            </div>


            <div
                id="leadList"
                class="lead-list"
            ></div>


        </section>


    </main>



    <!-- =====================================================
         LEAD DETAILS MODAL
    ====================================================== -->

    <div
        id="leadModal"
        class="lead-modal"
    >


        <div
            class="lead-backdrop"
            id="closeLead"
        ></div>


        <div class="lead-box">


            <button
                class="close-btn"
                id="closeLeadBtn"
                type="button"
                aria-label="Close"
            >
                ×
            </button>


            <div
                id="leadDetails"
            ></div>


        </div>


    </div>



    <!-- =====================================================
         FIREBASE / MANAGEMENT DASHBOARD JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="../js/admin-dashboard.js"
    ></script>


</body>

</html>
